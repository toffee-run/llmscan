[project]
name = "llmscan"
version = "0.1.0"
description = "Read-only TUI that estimates how much of a repository was written by an LLM"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "textual>=0.86",
    "pathspec>=0.12",
    "torch>=2.4",
    "transformers>=4.46",
]

[project.scripts]
llmscan = "llmscan.cli:main"
llmscan-eval = "llmscan.cli:eval_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
